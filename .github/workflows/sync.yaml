name: "Sync with Brief You"

# Lede is its own project. Once a day this only READS new commits from Humorist2601/BriefYou
# (the app Lede started from) and merges them into Lede's main branch, keeping all Lede changes,
# then offers the result as a pull request in this repository ("Brief You update"). Nothing is
# ever pushed to Brief You, and nothing reaches main or a signed release until you merge that pull
# request yourself. If the same lines were changed on both sides, nothing is changed: the run
# fails (GitHub emails the owner) and lists the conflicting files. Delete this file, or disable the
# workflow in the Actions tab, to stop following Brief You.

on:
    schedule:
        - cron: "17 3 * * *" # daily, 03:17 UTC
    workflow_dispatch:

env:
    UPSTREAM_REPO: https://github.com/Humorist2601/BriefYou.git
    UPSTREAM_BRANCH: main
    BRIEF_BRANCH: main
    # Where the merged update waits for review (builds skip this branch).
    SYNC_BRANCH: brief-you-sync

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.BRIEF_BRANCH }}
                  fetch-depth: 0

            - name: Merge Brief You updates into Lede
              id: merge
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote add upstream "$UPSTREAM_REPO"
                  git fetch --no-tags upstream "$UPSTREAM_BRANCH"

                  if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
                      echo "Already up to date with Brief You."
                      echo "result=up-to-date" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  new=$(git log --oneline HEAD.."upstream/$UPSTREAM_BRANCH" | wc -l)
                  if git merge --no-edit -m "Merge Brief You ($new new commits) into Lede" "upstream/$UPSTREAM_BRANCH"; then
                      echo "result=merged" >> "$GITHUB_OUTPUT"
                  else
                      conflicts=$(git diff --name-only --diff-filter=U)
                      git merge --abort
                      echo "result=conflict" >> "$GITHUB_OUTPUT"
                      {
                          echo "Brief You has $new new commits that change the same lines as Lede, so they were not merged automatically. Nothing in Lede was changed."
                          echo
                          echo "Conflicting files:"
                          echo "$conflicts" | sed 's/^/- `/; s/$/`/'
                          echo
                          echo "Upstream: $UPSTREAM_REPO ($UPSTREAM_BRANCH)"
                      } > body.md
                      cat body.md >> "$GITHUB_STEP_SUMMARY"
                      # Open an Issue when Issues are enabled (best effort).
                      title="Brief You update needs a manual merge"
                      if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null | grep -q .; then
                          gh issue create --title "$title" --body-file body.md || true
                      fi
                      echo "::error title=Manual merge needed::Brief You changes conflict with Lede in: $(echo $conflicts)"
                      exit 1
                  fi

            - name: Offer the merge as a pull request
              if: steps.merge.outputs.result == 'merged'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if ! git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"; then
                      # Usually means Brief You changed a workflow file, which this token may not push.
                      title="Brief You update could not be pushed automatically"
                      if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null | grep -q .; then
                          gh issue create --title "$title" --body "The merge with Brief You succeeded but could not be pushed (Brief You probably changed a file under .github/workflows). It needs to be merged by hand." || true
                      fi
                      echo "::error title=Push failed::The merge with Brief You could not be pushed; it needs to be merged by hand."
                      exit 1
                  fi
                  {
                      echo "Brief You's latest changes, merged with Lede. Review them, then merge this pull request to build and release them."
                      echo
                      echo "### New Brief You commits"
                      git log --format='- %s (%h)' "origin/$BRIEF_BRANCH..upstream/$UPSTREAM_BRANCH" | head -50
                      echo
                      # Which of Lede's changes and copies Brief You's update touches.
                      python3 .github/fork/fork_check.py report \
                          "$(git merge-base "origin/$BRIEF_BRANCH" "upstream/$UPSTREAM_BRANCH")" \
                          "upstream/$UPSTREAM_BRANCH" || true
                  } > pr.md
                  existing=$(gh pr list --head "$SYNC_BRANCH" --base "$BRIEF_BRANCH" --state open --json number --jq '.[0].number')
                  if [ -n "$existing" ]; then
                      gh pr edit "$existing" --body-file pr.md
                      echo "Updated pull request #$existing" >> "$GITHUB_STEP_SUMMARY"
                  elif ! gh pr create --head "$SYNC_BRANCH" --base "$BRIEF_BRANCH" --title "Brief You update" --body-file pr.md; then
                      # Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
                      link="https://github.com/${{ github.repository }}/compare/$BRIEF_BRANCH...$SYNC_BRANCH"
                      echo "The update is ready on the \`$SYNC_BRANCH\` branch, but the pull request couldn't be opened automatically. Open it here: $link" >> "$GITHUB_STEP_SUMMARY"
                      echo "::warning title=Open the pull request by hand::$link (or allow GitHub Actions to create pull requests in the repository settings)"
                  fi
